# Definizione del progetto Xcode per XcodeGen.
# Genera Habits.xcodeproj con:  xcodegen generate
#
# Installa XcodeGen con:  brew install xcodegen

name: Habits
options:
  bundleIdPrefix: com.danielemuscia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: it
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "39ZSPD3CUW"

targets:
  # Framework condiviso: modelli SwiftData, store e helper usati da app e widget.
  HabitsKit:
    type: framework
    platform: iOS
    sources:
      - path: HabitsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielemuscia.HabitsKit
        GENERATE_INFOPLIST_FILE: YES

  Habits:
    type: application
    platform: iOS
    sources:
      - path: Habits
    settings:
      base:
        INFOPLIST_FILE: Habits/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.danielemuscia.habits
        PRODUCT_NAME: Habits
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Habits/Habits.entitlements
    dependencies:
      - target: HabitsKit
      - target: HabitsWidget
    postBuildScripts:
      # Build number automatico: usa il numero di commit git, così cresce a ogni
      # commit senza interventi manuali (richiesto da App Store/TestFlight).
      - name: Auto build number (git)
        basedOnDependencyAnalysis: false
        script: |
          build=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "$CURRENT_PROJECT_VERSION")
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$plist"
            echo "CFBundleVersion impostato a $build"
          fi

  # Estensione widget (WidgetKit + App Intents interattivi, iOS 17+).
  HabitsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HabitsWidget
    settings:
      base:
        INFOPLIST_FILE: HabitsWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.danielemuscia.habits.widget
        PRODUCT_NAME: HabitsWidget
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HabitsWidget/HabitsWidget.entitlements
    dependencies:
      - target: HabitsKit
