# Definizione del progetto Xcode per XcodeGen.
# Genera Habits.xcodeproj con:  xcodegen generate
#
# Installa XcodeGen con:  brew install xcodegen

name: Habits
options:
  bundleIdPrefix: com.habits
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: it
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Habits:
    type: application
    platform: iOS
    sources:
      - path: Habits
        excludes:
          - "Config/Secrets.xcconfig"
          - "Config/Secrets.example.xcconfig"
    configFiles:
      Debug: Habits/Config/Base.xcconfig
      Release: Habits/Config/Base.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Habits/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.habits.app
        PRODUCT_NAME: Habits
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Supabase
        product: Supabase
